name: dbt CI

# Runs on every push to any branch except main (main is for deploys).
# Builds and tests the project in a temporary schema (ci_run_<number>)
# in the dev catalog, then drops that schema.

on:
  push:
    branches: [master]
  workflow_dispatch:

# A new push to the same branch cancels the run already in progress.
concurrency:
  group: dbt-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  DBT_TARGET: ci
  DBT_PROFILES_DIR: .
  CI_SCHEMA: ci_run_${{ github.run_number }}
  DBX_ID_APPLICATION_ID: ${{ secrets.DBX_ID_APPLICATION_ID }}
  DBX_SECRET: ${{ secrets.DBX_SECRET }}
  DEV_HOST: ${{ secrets.DEV_HOST }}
  DEV_HTTP_PATH: ${{ secrets.DEV_HTTP_PATH }}
  DEV_CATALOG: ${{ secrets.DEV_CATALOG }}

jobs:
  dbt-build:
    name: dbt build (ci)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cde_project

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Test connection
        run: uv run dbt debug

      - name: Build and test models
        run: uv run dbt build --select +fct_marketing_spend

      - name: Drop CI schema
        if: always()
        run: uv run dbt run-operation drop_ci_schema