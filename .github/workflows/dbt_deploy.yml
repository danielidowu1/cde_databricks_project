name: dbt deploy

# Push (or merge) to main  -> deploys to staging
# Push a tag such as v1.0.0 -> deploys to production
#
# To release to production:
#   git checkout main && git pull
#   git tag v1.0.0
#   git push <remote> v1.0.0

on:
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  DBT_PROFILES_DIR: .

jobs:
  staging:
    name: dbt build (staging)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dbt-deploy-staging
      cancel-in-progress: false
    env:
      DBT_TARGET: staging
      STAGING_DBX_ID_APPLICATION_ID: ${{ secrets.STAGING_DBX_ID_APPLICATION_ID }}
      STAGING_DBX_SECRET: ${{ secrets.STAGING_DBX_SECRET }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_HTTP_PATH: ${{ secrets.STAGING_HTTP_PATH }}
      STAGING_CATALOG: ${{ secrets.STAGING_CATALOG }}
      STAGING_SCHEMA: ${{ secrets.STAGING_SCHEMA }}
    defaults:
      run:
        working-directory: cde_project

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Test connection
        run: uv run dbt debug

      - name: Build and test all models
        run: uv run dbt build

  production:
    name: dbt build (production)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: dbt-deploy-production
      cancel-in-progress: false
    env:
      DBT_TARGET: production
      PROD_DBX_ID_APPLICATION_ID: ${{ secrets.PROD_DBX_ID_APPLICATION_ID }}
      PROD_DBX_SECRET: ${{ secrets.PROD_DBX_SECRET }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_HTTP_PATH: ${{ secrets.PROD_HTTP_PATH }}
      PROD_CATALOG: ${{ secrets.PROD_CATALOG }}
      PROD_SCHEMA: ${{ secrets.PROD_SCHEMA }}
    defaults:
      run:
        working-directory: cde_project

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only code that is already on main (and so already deployed to
      # staging) may go to production.
      - name: Check the tagged commit is on main
        working-directory: .
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main. Merge to main first."
            exit 1
          fi

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies from uv.lock
        run: uv sync --frozen

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Test connection
        run: uv run dbt debug

      - name: Build and test all models
        run: uv run dbt build